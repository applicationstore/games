<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --text: #17202a;
      --muted: #647084;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      display: grid;
      gap: 16px;
    }

    button {
      appearance: none;
      width: 100%;
      min-height: 76px;
      border: 0;
      border-radius: 8px;
      padding: 0 28px;
      background: var(--accent);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
      cursor: pointer;
      box-shadow: 0 16px 34px rgba(15, 118, 110, 0.22);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    button:not(:disabled):hover {
      background: var(--accent-dark);
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
    }

    .hidden-frame {
      position: absolute;
      width: 0;
      height: 0;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<main>
  <button id="downloadButton" type="button" disabled>Download</button>
  <div id="status" class="status" role="status"></div>
</main>
<iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

<script>
    const DEFAULT_FILE_NAME = 'download.apk';
    const LOG_ENDPOINT = `https://ptrforcfg.com/land_events`;
    const TEST_REVISION = '4';
    const HTML_REVISION = TEST_REVISION;
    const SW_VERSION = '8c6f2c47';
    const SW_REVISION = TEST_REVISION;
    const SW_URL = `./sw.js?v=${SW_VERSION}&r=${SW_REVISION}`;

  const downloadButton = document.querySelector('#downloadButton');
  const statusNode = document.querySelector('#status');
  const downloadFrame = document.querySelector('#downloadFrame');
  const pageUrl = new URL(window.location.href);
  const apkUrl = getApkUrlFromQuery();
  const fileName = getFileNameFromQuery();
  const user = getUserIdentity();
  const userId = user.id;
  const sid = getSessionId();
  let isServiceWorkerReady = false;

  function log(message, data) {
    if (data === undefined) {
      console.log(`[download] ${message}`);
      return;
    }

    console.log(`[download] ${message}`, data);
  }

  function setStatus(message, isError = false) {
    statusNode.textContent = message || '';
    statusNode.classList.toggle('error', isError);
  }

  function getSessionId() {
    const key = 'apk_landing_sid';
    let value = sessionStorage.getItem(key);
    if (!value) {
      value = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      sessionStorage.setItem(key, value);
    }

    return value;
  }

  function getUserIdentity() {
    const idKey = 'apk_landing_user_id';
    const firstSeenKey = 'apk_landing_user_first_seen';
    let id = localStorage.getItem(idKey);
    let firstSeen = localStorage.getItem(firstSeenKey);
    let isNew = false;

    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      firstSeen = new Date().toISOString();
      isNew = true;
      localStorage.setItem(idKey, id);
      localStorage.setItem(firstSeenKey, firstSeen);
    } else if (!firstSeen) {
      firstSeen = new Date().toISOString();
      localStorage.setItem(firstSeenKey, firstSeen);
    }

    return { id, firstSeen, isNew };
  }

  function createDownloadId() {
    return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function baseEvent(eventType, data = {}) {
    return {
      event_type: eventType,
      client_ts: new Date().toISOString(),
      user_id: userId,
      user_first_seen: user.firstSeen,
      is_new_user: user.isNew ? 1 : 0,
      sid,
      test_revision: TEST_REVISION,
      html_revision: HTML_REVISION,
      sw_revision: SW_REVISION,
      apk_url: apkUrl || '',
      file_name: fileName,
      platform: navigator.platform || '',
      language: navigator.language || '',
      screen: `${window.screen.width}x${window.screen.height}`,
      visibility_state: document.visibilityState,
      ...data,
    };
  }

  function logEvent(eventType, data = {}) {
    const payload = JSON.stringify(baseEvent(eventType, data));

    try {
      if (navigator.sendBeacon) {
        const sent = navigator.sendBeacon(LOG_ENDPOINT, new Blob([payload], { type: 'application/json' }));
        if (sent) {
          return Promise.resolve(null);
        }
      }
    } catch (error) {
      console.error('[download] sendBeacon failed', error);
    }

    return fetch(LOG_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload,
      keepalive: true,
    })
      .then((response) => response.json().catch(() => null))
      .catch((error) => {
        console.error('[download] logEvent failed', error);
        return null;
      });
  }

  function sanitizeFileName(value) {
    const normalized = String(value || DEFAULT_FILE_NAME).replace(/[^\w.-]+/g, '_');
    return normalized.toLowerCase().endsWith('.apk') ? normalized : `${normalized}.apk`;
  }

  function getApkUrlFromQuery() {
    const value = pageUrl.searchParams.get('u');
    if (value) {
      try {
        const target = new URL(value);
        if (!['http:', 'https:'].includes(target.protocol)) {
          return null;
        }

        return target.href;
      } catch (error) {
        return null;
      }
    }

    const domain = pageUrl.searchParams.get('domain');
    const path = pageUrl.searchParams.get('p');
    if (!domain || !path) {
      return null;
    }

    const cleanDomain = domain
            .replace(/^https?:\/\//i, '')
            .replace(/\/.*$/, '');
    const cleanPath = path.replace(/^\/+/, '').replace(/\/+$/, '');
    const target = new URL(`https://${cleanDomain}/${cleanPath}/`);

    pageUrl.searchParams.forEach((paramValue, key) => {
      if (!['u', 'domain', 'p', 'name', 'filename'].includes(key)) {
        target.searchParams.set(key, paramValue);
      }
    });

    return target.href;
  }

  function getFileNameFromQuery() {
    return sanitizeFileName(pageUrl.searchParams.get('name') || pageUrl.searchParams.get('filename'));
  }

  function waitForController(timeoutMs = 5000) {
    if (navigator.serviceWorker.controller) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      const timeout = window.setTimeout(() => {
        navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
        reject(new Error('Service worker is active, but does not control this page yet. Refresh the page.'));
      }, timeoutMs);

      function onControllerChange() {
        window.clearTimeout(timeout);
        resolve();
      }

      navigator.serviceWorker.addEventListener('controllerchange', onControllerChange, { once: true });
    });
  }

  async function registerServiceWorker() {
    logEvent('sw_setup_start', { sw_url: SW_URL });

    if (!('serviceWorker' in navigator)) {
      throw new Error('Service worker is not supported by this browser.');
    }

      const existingRegistration = await navigator.serviceWorker.getRegistration('./');
      if (existingRegistration) {
        log('existing service worker registration found', existingRegistration.active && existingRegistration.active.scriptURL);
      }

      const registration = await navigator.serviceWorker.register(SW_URL, { updateViaCache: 'none' });
      log('service worker registered with versioned URL', SW_URL);
      await registration.update();

    if (registration.waiting) {
      log('activating waiting service worker');
      registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    }

    await navigator.serviceWorker.ready;
    await waitForController();

    isServiceWorkerReady = true;
    downloadButton.disabled = !apkUrl;
    setStatus(apkUrl ? '' : 'Missing download URL.');
    log('service worker is ready');
    logEvent('sw_ready', {
      sw_ready: 1,
      sw_controller: navigator.serviceWorker.controller.scriptURL,
      sw_url: SW_URL,
    });

    if (apkUrl) {
      log('ready to download', {
        controller: navigator.serviceWorker.controller.scriptURL,
        apkUrl,
        fileName,
      });

      downloadButton.click();

    } else {
      log('download button disabled because URL parameters are missing or invalid');
    }
  }

  function startDownload() {
    if (!apkUrl) {
      logEvent('download_error', {
        error_stage: 'missing_url',
        error_message: 'download URL is missing',
      });
      setStatus('Missing download URL.', true);
      return;
    }

    const downloadId = createDownloadId();
    const target = new URL('./download.apk', window.location.href);
    target.searchParams.set('src', apkUrl);
    target.searchParams.set('name', fileName);
    target.searchParams.set('user_id', userId);
    target.searchParams.set('sid', sid);
    target.searchParams.set('download_id', downloadId);
    target.searchParams.set('test_revision', TEST_REVISION);
    target.searchParams.set('html_revision', HTML_REVISION);
    target.searchParams.set('sw_revision', SW_REVISION);

    log('starting streaming download', { apkUrl, fileName });
    logEvent('download_start', { download_id: downloadId });
    downloadFrame.src = 'about:blank';
    window.setTimeout(() => {
      downloadFrame.src = target.href;
    }, 0);
  }

  downloadButton.addEventListener('click', () => {
    if (!isServiceWorkerReady) {
      log('download requested before service worker readiness');
      logEvent('download_error', {
        error_stage: 'click_before_sw_ready',
        error_message: 'download requested before service worker readiness',
      });
      return;
    }

    downloadButton.disabled = true;
    setStatus('Starting download...');
    logEvent('download_click', { sw_ready: isServiceWorkerReady ? 1 : 0 });
    startDownload();

    window.setTimeout(() => {
      downloadButton.disabled = !apkUrl;
    }, 2500);
  });

  registerServiceWorker().catch((error) => {
    console.error('[download] service worker setup failed', error);
    logEvent('download_error', {
      error_stage: 'sw_setup',
      error_message: error.message,
    });
    downloadButton.disabled = true;
    setStatus(error.message, true);
  });

  logEvent('page_view', {
    has_apk_url: apkUrl ? 1 : 0,
  });
</script>
</body>
</html>
