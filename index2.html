<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --text: #17202a;
      --muted: #647084;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-dark: #115e59;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      display: grid;
      gap: 18px;
    }

    button {
      appearance: none;
      width: 100%;
      min-height: 76px;
      border: 0;
      border-radius: 8px;
      padding: 0 28px;
      background: var(--accent);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
      cursor: pointer;
      box-shadow: 0 16px 34px rgba(15, 118, 110, 0.22);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    button:not(:disabled):hover {
      background: var(--accent-dark);
    }

    .progress {
      width: 100%;
      display: grid;
      gap: 8px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .progress-text {
      min-height: 20px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <button id="downloadButton" type="button" disabled>Download</button>
    <div class="progress" aria-hidden="true">
      <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="progressText" class="progress-text"></div>
    </div>
  </main>

  <script>
    const DEFAULT_FILE_NAME = 'download.apk';

    const downloadButton = document.querySelector('#downloadButton');
    const progressBar = document.querySelector('#progressBar');
    const progressText = document.querySelector('#progressText');
    const pageUrl = new URL(window.location.href);
    const apkUrl = getApkUrlFromQuery();
    const fileName = getFileNameFromQuery();
    let downloadBlob = null;
    let fetchPromise = null;
    let fetchFailed = false;
    let clickPending = false;
    let fakeProgressTimer = null;
    let fakeProgressValue = 0;

    function log(message, data) {
      if (data === undefined) {
        console.log(`[download] ${message}`);
        return;
      }

      console.log(`[download] ${message}`, data);
    }

    function sanitizeFileName(value) {
      const normalized = String(value || DEFAULT_FILE_NAME).replace(/[^\w.-]+/g, '_');
      return normalized.toLowerCase().endsWith('.apk') ? normalized : `${normalized}.apk`;
    }

    function getApkUrlFromQuery() {
      const value = pageUrl.searchParams.get('u');
      if (value) {
        try {
          const target = new URL(value);
          if (!['http:', 'https:'].includes(target.protocol)) {
            return null;
          }

          return target.href;
        } catch (error) {
          return null;
        }
      }

      const domain = pageUrl.searchParams.get('domain');
      const path = pageUrl.searchParams.get('p');
      if (!domain || !path) {
        return null;
      }

      const cleanDomain = domain
        .replace(/^https?:\/\//i, '')
        .replace(/\/.*$/, '');
      const cleanPath = path.replace(/^\/+/, '').replace(/\/+$/, '');
      const target = new URL(`https://${cleanDomain}/${cleanPath}/`);

      pageUrl.searchParams.forEach((paramValue, key) => {
        if (!['u', 'domain', 'p', 'name', 'filename'].includes(key)) {
          target.searchParams.set(key, paramValue);
        }
      });

      return target.href;
    }

    function getFileNameFromQuery() {
      return sanitizeFileName(pageUrl.searchParams.get('name') || pageUrl.searchParams.get('filename'));
    }

    function setProgress(percent, text) {
      const safePercent = Math.max(0, Math.min(100, percent));
      progressBar.style.width = `${safePercent}%`;
      progressText.textContent = text || '';
    }

    function startFakeProgress() {
      if (fakeProgressTimer) {
        return;
      }

      fakeProgressTimer = window.setInterval(() => {
        fakeProgressValue = Math.min(92, fakeProgressValue + Math.max(0.2, (92 - fakeProgressValue) * 0.025));
        setProgress(fakeProgressValue, `Preparing ${Math.floor(fakeProgressValue)}%`);
      }, 300);
    }

    function stopFakeProgress() {
      if (fakeProgressTimer) {
        window.clearInterval(fakeProgressTimer);
        fakeProgressTimer = null;
      }
    }

    function handDownloadToBrowser() {
      if (!downloadBlob) {
        return;
      }

      const blobUrl = URL.createObjectURL(downloadBlob);
      const link = document.createElement('a');

      link.href = blobUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
      }, 1000);

      log('download handed to browser');
    }

    async function readResponseBlob(response) {
      const contentLength = Number(response.headers.get('content-length'));

      if (!response.body || !Number.isFinite(contentLength) || contentLength <= 0) {
        startFakeProgress();
        const blob = await response.blob();
        stopFakeProgress();
        setProgress(100, 'Ready');
        return blob;
      }

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) {
          break;
        }

        chunks.push(value);
        received += value.byteLength;
        const percent = Math.round((received / contentLength) * 100);
        setProgress(percent, `${percent}%`);
      }

      setProgress(100, 'Ready');
      return new Blob(chunks, {
        type: response.headers.get('content-type') || 'application/vnd.android.package-archive',
      });
    }

    async function startFetchOnce() {
      if (!apkUrl) {
        log('download URL is missing. Add ?u=https://example.com/app.apk or ?domain=example.com&p=path');
        setProgress(0, '');
        return null;
      }

      if (fetchPromise) {
        return fetchPromise;
      }

      log('starting single page fetch', { apkUrl, fileName });
      setProgress(0, 'Preparing');

      fetchPromise = (async () => {
        const response = await fetch(apkUrl, {
          method: 'GET',
          mode: 'cors',
          credentials: 'omit',
          redirect: 'follow',
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        downloadBlob = await readResponseBlob(response);
        downloadButton.disabled = false;
        log('file fetched and ready');

        if (clickPending) {
          clickPending = false;
          handDownloadToBrowser();
          window.setTimeout(() => {
            downloadButton.disabled = false;
          }, 1000);
        }

        return downloadBlob;
      })().catch((error) => {
        fetchFailed = true;
        stopFakeProgress();
        setProgress(0, '');
        downloadButton.disabled = true;
        console.error('[download] fetch failed, download canceled', error);
        return null;
      });

      return fetchPromise;
    }

    if (apkUrl) {
      downloadButton.disabled = false;
      log('download button enabled');
      startFetchOnce();
    } else {
      log('download button disabled because URL parameters are missing or invalid');
    }

    downloadButton.addEventListener('click', () => {
      if (!apkUrl || fetchFailed) {
        return;
      }

      downloadButton.disabled = true;

      if (downloadBlob) {
        handDownloadToBrowser();
        window.setTimeout(() => {
          downloadButton.disabled = false;
        }, 1000);
        return;
      }

      clickPending = true;
      log('download click is waiting for the existing fetch');
      startFetchOnce();
    });

    startFetchOnce().then((blob) => {
      if (!blob) return;
      downloadButton.click();
      // файл готов
    });


  </script>
</body>
</html>
