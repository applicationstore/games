<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirect</title>
</head>
<body>
  <script>
    const COOKIE_PREFIX = 'ff_';
    const RESERVED_PARAMS = new Set(['endpoint', 'post_url']);
    const pageUrl = new URL(window.location.href);

    async function releaseServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        return true;
      }

      const reloadKey = 'ff_sw_reloaded:pb';
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister()));

      if (navigator.serviceWorker.controller && !sessionStorage.getItem(reloadKey)) {
        sessionStorage.setItem(reloadKey, '1');
        window.location.reload();
        return false;
      }

      sessionStorage.removeItem(reloadKey);
      return true;
    }

    function getEndpoint() {
      const value = pageUrl.searchParams.get('endpoint') || pageUrl.searchParams.get('post_url');
      if (!value) {
        return null;
      }

      try {
        const target = new URL(value);
        return ['https:', 'http:'].includes(target.protocol) ? target : null;
      } catch (error) {
        return null;
      }
    }

    function readLandingCookies() {
      const cookies = {};

      document.cookie
        .split(';')
        .map((item) => item.trim())
        .filter(Boolean)
        .forEach((item) => {
          const separatorIndex = item.indexOf('=');
          const rawName = separatorIndex >= 0 ? item.slice(0, separatorIndex) : item;
          const rawValue = separatorIndex >= 0 ? item.slice(separatorIndex + 1) : '';
          const name = decodeURIComponent(rawName);

          if (name.startsWith(COOKIE_PREFIX)) {
            cookies[name] = decodeURIComponent(rawValue);
          }
        });

      return cookies;
    }

    function appendPassthroughParams(target) {
      pageUrl.searchParams.forEach((value, key) => {
        if (!RESERVED_PARAMS.has(key)) {
          target.searchParams.append(key, value);
        }
      });
    }

    function appendLandingData(target) {
      target.searchParams.set('event_type', 'pb');
      target.searchParams.set('client_ts', new Date().toISOString());
      target.searchParams.set('pb_path', window.location.pathname);
      target.searchParams.set('pb_referrer', document.referrer);

      Object.entries(readLandingCookies()).forEach(([key, value]) => {
        target.searchParams.set(key, value);
      });
    }

    async function run() {
      if (!(await releaseServiceWorker())) {
        return;
      }

      const endpoint = getEndpoint();
      if (!endpoint) {
        window.location.replace('about:blank');
        return;
      }

      appendPassthroughParams(endpoint);
      appendLandingData(endpoint);
      window.location.replace(endpoint.href);
    }

    run();
  </script>
</body>
</html>
