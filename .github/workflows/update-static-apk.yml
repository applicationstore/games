name: Update static APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-static-apk.yml
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct APK URL. If empty, repository secret APK_URL is used.
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-static-apk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET_PATH: 2/download.apk
      APK_URL: ${{ github.event.inputs.apk_url || secrets.APK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate input
        run: |
          set -euo pipefail
          if [ -z "${APK_URL}" ]; then
            echo "APK_URL is empty. Set repository secret APK_URL or pass workflow_dispatch input apk_url." >&2
            exit 2
          fi

      - name: Download APK
        run: |
          set -euo pipefail
          tmp="${TARGET_PATH}.tmp"
          mkdir -p "$(dirname "$TARGET_PATH")"
          echo "TARGET_PATH=${TARGET_PATH}"
          echo "APK_URL=${APK_URL}"
          curl -fL -v --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 \
            -A 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36' \
            -H 'Accept: application/vnd.android.package-archive,application/octet-stream,*/*' \
            -w '\nhttp_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_namelookup=%{time_namelookup}\ntime_connect=%{time_connect}\ntime_appconnect=%{time_appconnect}\ntime_starttransfer=%{time_starttransfer}\ntime_total=%{time_total}\nsize_download=%{size_download}\nurl_effective=%{url_effective}\n' \
            --output "$tmp" "$APK_URL"
          ls -l "$tmp"
          file "$tmp" || true
          test -s "$tmp"
          mv -f "$tmp" "$TARGET_PATH"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- "$TARGET_PATH"; then
            echo "APK is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          git commit -m "Update static APK"
          git push
