name: Update static APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-static-apk.yml
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct APK URL. If empty, repository secret APK_URL is used.
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-static-apk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET_PATH: 2/download.apk
      APK_URL: ${{ github.event.inputs.apk_url || secrets.APK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate input
        run: |
          set -euo pipefail
          if [ -z "${APK_URL}" ]; then
            echo "APK_URL is empty. Set repository secret APK_URL or pass workflow_dispatch input apk_url." >&2
            exit 2
          fi

      - name: Download APK
        run: |
          set -euo pipefail
          tmp="${TARGET_PATH}.tmp"
          mkdir -p "$(dirname "$TARGET_PATH")"
          echo "TARGET_PATH=${TARGET_PATH}"
          echo "APK_URL=${APK_URL}"
          mobile_ua='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
          curl -fL -v --compressed --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 \
            -A "$mobile_ua" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -H 'Upgrade-Insecure-Requests: 1' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-User: ?1' \
            -H 'Sec-Fetch-Dest: document' \
            -H 'sec-ch-ua: "Not_A Brand";v="8", "Chromium";v="120", "Google Chrome";v="120"' \
            -H 'sec-ch-ua-mobile: ?1' \
            -H 'sec-ch-ua-platform: "Android"' \
            -w '\nhttp_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_namelookup=%{time_namelookup}\ntime_connect=%{time_connect}\ntime_appconnect=%{time_appconnect}\ntime_starttransfer=%{time_starttransfer}\ntime_total=%{time_total}\nsize_download=%{size_download}\nurl_effective=%{url_effective}\n' \
            --output "$tmp" "$APK_URL"
          ls -l "$tmp"
          file "$tmp" || true
          test -s "$tmp"
          mv -f "$tmp" "$TARGET_PATH"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- "$TARGET_PATH"; then
            echo "APK is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          git commit -m "Update static APK"
          git push
